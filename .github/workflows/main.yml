name: Python Behave CI with Allure Report & Email

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' # Or your desired Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install allure-behave # Ensure allure-behave is installed for report generation
        pip install html-reporter # For generating simple HTML report if you also want that
        pip install smtplib-ssl # For sending emails securely

        # Install Allure Commandline Tool
        # Allure requires Java. Install OpenJDK.
        sudo apt-get update
        sudo apt-get install openjdk-11-jre -y
        # Download and install Allure Commandline
        wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.27.0/allure-commandline-2.27.0.zip # Check for latest version
        sudo unzip allure-commandline-*.zip -d /opt/allure
        echo "ALLURE_HOME=/opt/allure/allure-commandline-2.27.0" >> $GITHUB_ENV
        echo "/opt/allure/allure-commandline-2.27.0/bin" >> $GITHUB_PATH
        allure --version # Verify installation

        # Install Chrome (needed for Selenium)
        sudo apt-get install google-chrome-stable -y

    - name: Run Behave tests and generate Allure results
      run: |
        mkdir -p allure-results
        behave --format allure_behave.formatter:AllureFormatter --out allure-results ./front_end_automation/features
        behave --format allure_behave.formatter:AllureFormatter --out allure-results ./back_end_automation/features

    - name: Generate Allure Report
      run: |
        allure generate allure-results --clean -o allure-report

    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4 # Use a robust GitHub Pages action
      if: github.ref == 'refs/heads/main' # Deploy only from the main branch
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages # Or 'docs' if you configure GitHub Pages to use the docs folder on main

    - name: Send Email Notification
      # This step requires sensitive information (email credentials)
      # to Store these as GitHub Secrets (e.g., SENDER_EMAIL, SENDER_PASSWORD, RECIPIENT_EMAIL)
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        REPO_NAME: ${{ github.repository }}
      run: |
        python .github/workflows/send_email.py

    - name: Upload raw test results artifact (JSON) - optional
      uses: actions/upload-artifact@v4
      with:
        name: raw-behave-results-json
        path: allure-results